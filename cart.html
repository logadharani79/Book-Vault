<!DOCTYPE html>
<html>
<head>
  <title>My Cart</title>
  <link rel="stylesheet" href="cart.css">
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">

    <div class="logo-section">
        <img src="BV.png" class="logo-img" alt="Book Vault Logo">
        <div class="logo-text">Book Vault</div>
    </div>

    <div class="nav-right">

        <button class="back-btn"
                onclick="window.location.href='home.html'">
            ← Back
        </button>

        <span onclick="window.location.href='wishlist.html'">
            ❤️
        </span>

        <span onclick="window.location.href='cart.html'">
            🛒
        </span>

        <div class="profile-wrapper">

            <span class="profile-icon"
                  onclick="toggleProfileMenu()">
                👤
            </span>

            <div id="profileMenu" class="profile-menu">

                <p onclick="goAccount()">
                    Your Account
                </p>

                <p onclick="goOrders()">
                    Your Orders
                </p>

                <p onclick="window.location.href='wishlist.html'">
                    Your Wishlist
                </p>

                <p onclick="window.location.href='cart.html'">
                    Your Cart
                </p>

                <p onclick="logout()">
                    Logout
                </p>

            </div>

        </div>

    </div>

</header>

<!-- PAGE TITLE -->
<h2 class="title">🛒 My Cart</h2>

<!-- CART ITEMS -->
<div id="cartItems"></div>

<!-- TOTAL -->
<h3 id="grandTotal">Grand Total: ₹0</h3>

<script src="cart.js"></script>

</body>
</html>
